<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player | VGM Player</title>
    <link rel="stylesheet" href="player.css">
    <link rel="shortcut icon" href="logo.PNG" type="image/x-icon">
     <link rel="apple-touch-icon" href="logo.PNG">

    <script src="player.js" defer></script>
    <script src="https://kit.fontawesome.com/9b6d1f3105.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>


    <button id="back-btn" onclick="backBtn()"><i class="fa-solid fa-left-long"></i></button>

    <div class="cont">
        <div id="playlist-info">
            <img id="album-art" src="" alt="Cover Art" decoding="async" loading="eager" fetchpriority="high">
            <h1 id="game-title"></h1>
            <p id="desc"></p>
        </div>
        <div id="playlist"></div>
    </div>
        

        <audio id="audio-player"></audio>

        <div class="music-controls">
            <h2 id="song-title">No Song Playing</h2>
            <input type="range" id="seek-bar" value="0" min="0" step="any">

            <div class="control-btns">
                <button onclick="changeSpeed()" id="speed-btn" aria-label="Playback speed" type="button"><i class="fa-solid fa-gauge"></i><span id="speed-label">1.00x</span></button>
                <div id="speed-selection">
                    <div>
                        <div id="speed-labels">
                            <span style="justify-self: start;">0.25x</span>    <span style="justify-self: center;">1x</span>    <span style="justify-self: end;">2x</span>
                        </div>
                    <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.01" value="1.0" list="speed-options">
                    </div>

                    <datalist id="speed-options">
                        <option value="0.1" label="0.1x"></option>
                        <option value="0.25" label="0.25x"></option>
                        <option value="0.5" label="0.5x"></option>
                        <option value="0.75" label="0.75x"></option>
                        <option value="1.0" label="1.0x"></option>
                        <option value="1.25" label="1.25x"></option>
                        <option value="1.5" label="1.5x"></option>
                        <option value="1.75" label="1.75x"></option>
                        <option value="2.0" label="2.0x"></option>
                    </datalist>
                </div>
                <button onclick="prevTrack()"><i class="fa-solid fa-backward"></i></button>
                <button onclick="togglePlay()" id="play-pause" ><i class="fa-solid fa-play"></i></button>
                <button onclick="nextTrack()"><i class="fa-solid fa-forward"></i></button>
                <button onclick="toggleLoop()" id="loop-btn" aria-pressed="false"><i class="fa-solid fa-repeat"></i></button>
            </div>
        </div>


</body>
</html>
